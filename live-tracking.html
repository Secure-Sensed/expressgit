<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Tracking | FedEx</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Leaflet Map -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    :root {
      --fedex-purple: #4d148c;
      --fedex-orange: #ff6200;
      --bg-gray: #f0f0f0;
      --text: #333333;
      --muted: #6a6a6a;
      --line: #d9d9d9;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: "Roboto", "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background: var(--bg-gray);
      color: var(--text);
    }

    .site-header {
      background: var(--fedex-purple);
      border-top: 5px solid #ddd;
      padding: 16px 0;
    }

    .container {
      width: min(1220px, calc(100% - 48px));
      margin: 0 auto;
    }

    .nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }

    .logo {
      text-decoration: none;
      font-weight: 700;
      font-size: 42px;
      letter-spacing: -1px;
      color: #fff;
    }

    .logo .fed {
      color: #fff;
    }

    .logo .ex {
      color: var(--fedex-orange);
    }

    .tracking-container {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 20px;
      padding: 20px;
      height: calc(100vh - 100px);
    }

    #map {
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      z-index: 1;
    }

    .sidebar {
      background: var(--white);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      margin: 0 0 20px 0;
      font-size: 18px;
      color: var(--fedex-purple);
      border-bottom: 2px solid var(--line);
      padding-bottom: 10px;
    }

    .shipment-list {
      flex: 1;
      overflow-y: auto;
    }

    .shipment-item {
      padding: 12px;
      margin-bottom: 10px;
      background: #f9f9f9;
      border-left: 4px solid var(--fedex-orange);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .shipment-item:hover {
      background: #f0f0f0;
      transform: translateX(4px);
    }

    .shipment-item.active {
      background: rgba(255, 98, 0, 0.1);
      border-left-color: var(--fedex-purple);
    }

    .shipment-id {
      font-weight: 700;
      font-size: 12px;
      color: var(--fedex-purple);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .shipment-status {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .shipment-eta {
      font-size: 11px;
      color: var(--text);
      font-weight: 600;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 4px;
      background: var(--fedex-orange);
      color: white;
    }

    .refresh-btn {
      padding: 10px;
      background: linear-gradient(135deg, var(--fedex-orange), #e55a00);
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      margin-top: auto;
      transition: all 0.2s ease;
    }

    .refresh-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 98, 0, 0.3);
    }

    .info-panel {
      background: var(--white);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      position: absolute;
      bottom: 20px;
      left: 20px;
      max-width: 350px;
      z-index: 400;
      max-height: 280px;
      overflow-y: auto;
    }

    .info-panel h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      color: var(--fedex-purple);
    }

    .info-row {
      font-size: 12px;
      margin-bottom: 8px;
      display: grid;
      grid-template-columns: 120px 1fr;
    }

    .info-label {
      font-weight: 600;
      color: var(--muted);
    }

    .info-value {
      color: var(--text);
      word-break: break-word;
    }

    .map-legend {
      background: var(--white);
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 400;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .legend-icon {
      font-size: 20px;
      width: 24px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--muted);
    }

    @media (max-width: 968px) {
      .tracking-container {
        grid-template-columns: 1fr;
        height: auto;
      }

      .sidebar {
        max-height: 300px;
      }

      .info-panel {
        position: static;
        max-width: none;
        margin-top: 20px;
      }
    }

    .leaflet-popup-content {
      font-family: "Roboto", sans-serif;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header class="site-header" role="banner">
    <div class="container nav-row">
      <a class="logo" href="index.html" aria-label="FedEx home">
        <span class="fed">Fed</span><span class="ex">Ex</span>
      </a>
      <h1 style="margin: 0; color: white; font-size: 24px;">Live Tracking Map</h1>
    </div>
  </header>

  <div class="tracking-container">
    <div id="map"></div>

    <div class="sidebar">
      <h2>Active Shipments</h2>
      <div id="shipmentList" class="shipment-list">
        <div class="loading">Loading shipments...</div>
      </div>
      <button class="refresh-btn">🔄 Refresh</button>
    </div>

    <div class="map-legend">
      <div class="legend-item">
        <span class="legend-icon">🚚</span>
        <span>Truck</span>
      </div>
      <div class="legend-item">
        <span class="legend-icon">📦</span>
        <span>Parcel</span>
      </div>
      <div class="legend-item">
        <span class="legend-icon">👤</span>
        <span>Driver</span>
      </div>
      <div class="legend-item">
        <span class="legend-icon">✓</span>
        <span>Delivered</span>
      </div>
    </div>

    <div id="infoPanel" class="info-panel" style="display: none;">
      <!-- Dynamic content -->
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.min.js"></script>
  <script>
    const state = {
      map: null,
      markers: {},
      selectedShipment: null,
      shipments: [],
      updateInterval: null
    };

    const icons = {
      truck: L.icon({
        iconUrl: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIHZpZXdCb3g9IjAgMCAzMiAzMiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIHJ4PSI4IiBmaWxsPSIjZmY2MjAwIi8+PHRleHQgeD0iMTYiIHk9IjIwIiBmb250LXNpemU9IjIwIiBmaWxsPSJ3aGl0ZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+ 8tVzIjwvdGV4dD48L3N2Zz4=',
        iconSize: [32, 32],
        popupAnchor: [0, -16]
      }),
      parcel: L.icon({
        iconUrl: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjgiIGhlaWdodD0iMjgiIHZpZXdCb3g9IjAgMCAyOCAyOCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMjgiIGhlaWdodD0iMjgiIHJ4PSI0IiBmaWxsPSIjNGQxNDhjIi8+PHRleHQgeD0iMTQiIHk9IjE4IiBmb250LXNpemU9IjE2IiBmaWxsPSJ3aGl0ZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+8J+PiDwvdGV4dD48L3N2Zz4=',
        iconSize: [28, 28],
        popupAnchor: [0, -14]
      }),
      driver: L.icon({
        iconUrl: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48Y2lyY2xlIGN4PSIxMiIgY3k9IjEyIiByPSIxMiIgZmlsbD0iIzJlNzYzMiIvPjx0ZXh0IHg9IjEyIiB5PSIxNiIgZm9udC1zaXplPSIxNiIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiPvCfj6U8L3RleHQ+PC9zdmc+',
        iconSize: [24, 24],
        popupAnchor: [0, -12]
      })
    };

    async function initMap() {
      // Initialize Leaflet map centered on USA
      state.map = L.map('map').setView([39.8283, -98.5795], 4);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 18
      }).addTo(state.map);

      await loadShipments();
      setupEventListeners();

      // Auto-refresh every 10 seconds
      state.updateInterval = setInterval(() => loadShipments(), 10000);
    }

    async function loadShipments() {
      try {
        const response = await fetch('/api/shipments');
        const data = await response.json();

        if (!data.results || !Array.isArray(data.results)) {
          return;
        }

        state.shipments = data.results.filter(s => s.found && s.shipment);

        renderShipmentList();
        updateMapMarkers();
      } catch (error) {
        console.error('Failed to load shipments:', error);
      }
    }

    function renderShipmentList() {
      const list = document.getElementById('shipmentList');

      if (state.shipments.length === 0) {
        list.innerHTML = '<div class="loading">No active shipments</div>';
        return;
      }

      list.innerHTML = state.shipments
        .map(item => {
          const shipment = item.shipment;
          const status = (shipment.status || 'pending').replace(/_/g, ' ').toUpperCase();
          const eta = shipment.estimatedDelivery
            ? new Date(shipment.estimatedDelivery).toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
              })
            : 'Pending';

          return `
            <div class="shipment-item ${state.selectedShipment === shipment.trackingNumber ? 'active' : ''}" 
                 data-tracking="${shipment.trackingNumber}"
                 onclick="selectShipment('${shipment.trackingNumber}')">
              <div class="shipment-id">${shipment.trackingNumber}</div>
              <div class="shipment-status">${shipment.origin} → ${shipment.destination}</div>
              <div class="shipment-eta">ETA: ${eta}</div>
              <div class="status-badge">${status}</div>
            </div>
          `;
        })
        .join('');
    }

    function selectShipment(trackingNumber) {
      state.selectedShipment = trackingNumber;
      const shipment = state.shipments.find(s => s.shipment?.trackingNumber === trackingNumber)?.shipment;

      if (!shipment) return;

      // Update active state in list
      document.querySelectorAll('.shipment-item').forEach(item => {
        item.classList.toggle('active', item.dataset.tracking === trackingNumber);
      });

      // Center map on shipment
      if (shipment.currentLat && shipment.currentLng) {
        state.map.setView([shipment.currentLat, shipment.currentLng], 13);
      }

      // Show info panel
      showInfoPanel(shipment);

      renderShipmentList();
    }

    function updateMapMarkers() {
      state.shipments.forEach((item, idx) => {
        const shipment = item.shipment;
        const id = shipment.trackingNumber;

        // Origin marker
        if (shipment.originLat && shipment.originLng) {
          const originId = `origin-${id}`;
          if (state.markers[originId]) {
            state.map.removeLayer(state.markers[originId]);
          }
          state.markers[originId] = L.marker([shipment.originLat, shipment.originLng], {
            icon: icons.parcel,
            title: `Origin: ${shipment.origin}`
          })
            .bindPopup(`<strong>📍 Origin</strong><br>${shipment.origin}`)
            .addTo(state.map);
        }

        // Current location marker (truck/delivery)
        if (shipment.currentLat && shipment.currentLng) {
          if (state.markers[id]) {
            state.map.removeLayer(state.markers[id]);
          }

          const iconType = shipment.status === 'delivered' ? 'parcel' : 'truck';
          state.markers[id] = L.marker([shipment.currentLat, shipment.currentLng], {
            icon: icons[iconType],
            title: shipment.trackingNumber
          })
            .bindPopup(`
              <strong>${shipment.trackingNumber}</strong><br>
              Status: ${shipment.status}<br>
              Location: ${shipment.lastLocation || 'In Transit'}
            `)
            .addTo(state.map);

          // Bring selected shipment marker to front
          if (shipment.trackingNumber === state.selectedShipment) {
            state.markers[id].setZIndexOffset(1000);
          }
        }

        // Destination marker
        if (shipment.destinationLat && shipment.destinationLng) {
          const destId = `destination-${id}`;
          if (state.markers[destId]) {
            state.map.removeLayer(state.markers[destId]);
          }
          state.markers[destId] = L.marker([shipment.destinationLat, shipment.destinationLng], {
            icon: icons.parcel,
            title: `Destination: ${shipment.destination}`
          })
            .bindPopup(`<strong>🎯 Destination</strong><br>${shipment.destination}`)
            .addTo(state.map);
        }
      });
    }

    function showInfoPanel(shipment) {
      const panel = document.getElementById('infoPanel');
      const status = (shipment.status || 'pending').replace(/_/g, ' ').toUpperCase();

      panel.innerHTML = `
        <h3>${shipment.trackingNumber}</h3>
        <div class="info-row">
          <span class="info-label">Status:</span>
          <span class="info-value">${status}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Origin:</span>
          <span class="info-value">${shipment.origin}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Destination:</span>
          <span class="info-value">${shipment.destination}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Location:</span>
          <span class="info-value">${shipment.lastLocation || 'Live tracking'}</span>
        </div>
        <div class="info-row">
          <span class="info-label">ETA:</span>
          <span class="info-value">
            ${shipment.estimatedDelivery ? new Date(shipment.estimatedDelivery).toLocaleString('en-US', {
              month: 'short',
              day: 'numeric',
              hour: '2-digit',
              minute: '2-digit'
            }) : 'Pending'}
          </span>
        </div>
      `;

      panel.style.display = 'block';
    }

    function setupEventListeners() {
      document.querySelector('.refresh-btn').addEventListener('click', () => {
        loadShipments();
      });
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', initMap);

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (state.updateInterval) {
        clearInterval(state.updateInterval);
      }
    });
  </script>
</body>
</html>
